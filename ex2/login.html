<html>
<head>
    <title>Login</title>
</head>
<body style="background-image: url('background.avif'); background-size: cover; background-repeat: no-repeat; 
             background-position: center; background-attachment: fixed; color: SaddleBrown; font-family: Arial, sans-serif;">
    <center>
        <img src="logoo.png" width="150" height="150" style="border-radius: 50%; box-shadow: 5px 5px 10px gray;">

        <h1>ONLINE SHOPPING</h1>
        <h2>User Login</h2>

        <form>
            <table cellpadding="10">
                <tr>
                    <td>Email</td>
                    <td><input type="email" placeholder="Enter Email" required></td>
                </tr>

                <tr>
                    <td>Password</td>
                    <td><input type="password" placeholder="Enter Password" required></td>
                </tr>

                <tr>
                    <td colspan="2" align="center">
                        <button type="button" onclick="alert('Login Successful!')">Login</button>
                    </td>
                </tr>
            </table>
        </form>

        <hr>

        <a href="home.html" style="color: Brown; font-weight: bold; display: inline-block;" onmouseover="this.style.color='Red'" onmouseout="this.style.color='Brown'">Home</a> |
        <a href="register.html" style="color: Brown; font-weight: bold; display: inline-block;" onmouseover="this.style.color='Red'" onmouseout="this.style.color='Brown'">Register</a>
    </center>

</body>
</html>
